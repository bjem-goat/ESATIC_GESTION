services:
  - type: web
    name: esatic-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esatic-db
          property: connectionString
      - key: JWT_SECRET
        value: mbds_jwt_secret_2024
      - key: PORT
        value: 3001
